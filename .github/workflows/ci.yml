name: CI

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on another feature branch.
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run check
      - name: Test approval and reconciliation workflows
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
