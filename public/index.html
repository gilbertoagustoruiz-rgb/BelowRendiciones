<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1f3f" />
  <title>Below Rendiciones</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <section id="authView" class="auth-view hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-mark">B</div>
        <div><strong>Below</strong><span>Rendiciones</span></div>
      </div>
      <div id="loginPanel">
        <p class="eyebrow">ACCESO AL SISTEMA</p>
        <h1>Iniciar sesión</h1>
        <form id="loginForm" class="auth-form">
          <label>DNI / Pasaporte
            <input name="document_number" type="text" autocomplete="username" required />
          </label>
          <label>Contraseña
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="primary">Ingresar</button>
        </form>
      </div>
      <div id="bootstrapPanel" class="hidden">
        <p class="eyebrow">CONFIGURACIÓN INICIAL</p>
        <h1>Crear administrador</h1>
        <p class="auth-copy">Aún no existe un usuario ADMIN. Este formulario se desactiva automáticamente después de crear el primero.</p>
        <form id="bootstrapForm" class="auth-form">
          <label>Nombre completo
            <input name="full_name" type="text" required />
          </label>
          <label>DNI / Pasaporte
            <input name="document_number" type="text" required />
          </label>
          <label>Contraseña
            <input name="password" type="password" minlength="6" required />
          </label>
          <label>Confirmar contraseña
            <input name="password_confirm" type="password" minlength="6" required />
          </label>
          <button type="submit" class="primary">Crear ADMIN</button>
        </form>
      </div>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div><strong>Below</strong><span>Rendiciones</span></div>
    </div>
    <div class="user-card">
      <strong id="currentUserName">—</strong>
      <span id="currentUserProfile">—</span>
      <button id="logoutBtn" type="button">Cerrar sesión</button>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">GESTIÓN DE EVENTOS</p>
        <h1 id="pageTitle">Proyectos</h1>
      </div>
      <button class="primary" id="newBtn">+ Nuevo registro</button>
    </header>

    <section class="stats" id="stats"></section>

    <section class="card">
      <div class="card-head">
        <input id="search" type="search" placeholder="Buscar en todos los campos..." />
        <span id="countLabel"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="modal">
    <form id="recordForm">
      <div class="modal-head">
        <div>
          <p class="eyebrow" id="modalEyebrow">NUEVO</p>
          <h2 id="modalTitle">Registro</h2>
        </div>
        <button type="button" class="icon-btn" id="closeModal" aria-label="Cerrar">×</button>
      </div>
      <div id="formFields" class="form-grid"></div>
      <div id="modalHelp" class="modal-help"></div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="cancelBtn">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
  </dialog>

  </div>
  <div id="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
